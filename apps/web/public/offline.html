<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Offline — Ledgerly</title>
    <!--
      Self-contained by necessity: this page is served by the service worker
      when the network is unreachable, so it cannot fetch a stylesheet, a font,
      or an icon. Every value below is duplicated from the Ledgerly Dark theme
      rather than imported, and that duplication is the cost of the page
      working at all when nothing else does.
    -->
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        background: #0a0a0a;
        color: #ededed;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        line-height: 1.5;
      }
      .card {
        max-width: 22rem;
        margin: 1.5rem;
        padding: 2rem 1.5rem;
        text-align: center;
        background: #141414;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 0.75rem;
      }
      .logo {
        font-size: 1.25rem;
        font-weight: 700;
        color: #2f7d80;
        margin-bottom: 0.75rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #a1a1aa;
        font-size: 0.875rem;
      }
      button {
        font: inherit;
        font-size: 1rem;
        padding: 0.7rem 1.5rem;
        border: 0;
        border-radius: 0.5rem;
        background: #2f7d80;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">Ledgerly</div>
      <h1>You're offline</h1>
      <p>
        Ledgerly needs a connection to load your receipts. Any photos you were about to upload are
        still on your phone — try again once you have signal.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
