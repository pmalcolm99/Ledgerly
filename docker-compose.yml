name: ledgerly

services:
  webapp:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: ${IMAGE_LOCATION:-ghcr.io/pmalcolm99/ledgerly:latest}
    restart: always
    # Phase 6 (review finding L-7): an in-flight Sonnet 5 extraction call
    # can run tens of seconds. Docker's default 10s SIGTERM->SIGKILL grace
    # period could cut one off mid-call on every deploy/restart; this gives
    # packages/queue/src/shutdown.ts's graceful close room to actually wait
    # for active jobs before the container is force-killed.
    stop_grace_period: 30s
    # Localhost only — nothing but the Cloudflare Tunnel can reach this
    # (ARCHITECTURE.md §8, D-16). db and redis publish no ports at all.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:${APP_PORT:-3000}"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      UPLOADS_DIR: /app/uploads
      BACKUPS_DIR: /app/backups
      PORT: "${APP_PORT:-3000}"
    volumes:
      - app_uploads:/app/uploads
      - app_backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:'+(process.env.PORT||3000)+'/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # No `user:` override here — the image itself declares `USER node`
    # (F-31), so the container starts unprivileged and entrypoint.sh takes
    # its already-non-root branch and execs straight through. That branch
    # exists because Forkd took a production 502 calling su-exec
    # unconditionally (docker/entrypoint.sh, task 2.10); both it and the
    # root-start path are still tested.
    #
    # F-31: defence in depth around that. `no-new-privileges` stops any
    # setuid binary in the image from regaining root, and the app needs no
    # Linux capabilities at all — it binds 3000, not a privileged port.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  app_uploads:
  app_backups:
  db_data:
  redis_data:
